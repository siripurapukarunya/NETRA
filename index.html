<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA-ROVER MONITORING SYSTEM</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <style type="text/css">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: rgba(48, 2, 2, 0.471);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }
        button {
            font-family: inherit;
            background: rgb(246, 221, 29);
            color: brown;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .topbar {
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 15px 4%;
            background-color: red;
            border-bottom: 1px solid rgba(255, 0, 0, 0.938);
        }
        .brand {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .brand-logo {
            background-color: rgb(0, 0, 0);
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 23px;
        }
        .brand h1 {
            color: rgb(17, 12, 155);
            letter-spacing: 3px;
        }
        .brand p {
            color: rgb(17, 12, 155);
            font-size: 9px;
        }
        .nav {
            display: flex;
            gap: 20px;
        }
        .nav a {
            color: aquamarine;
            font-size: 13px;
            text-decoration: none;
        }
        .nav a:hover {
            color: rgb(0, 255, 17);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            color:#39d6a0;
        }
        .online-dot {
            width: 10px;
            height: 10px;
            background-color: #39d6a0;
            border-radius: 50%;
            display: inline-block;
        }
        #clock{
            color: #ffd700;
            font-family: monospace;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <!-- Logo and title -->
        <div class="brand">
            <div class="brand-logo">N</div>
            <div>
                <h1>NETRA</h1>
                <p>Robot Mission Control</p>
            </div>
        </div>

        <!-- Added class="nav" here -->
        <nav class="nav">
            <a href="#Dashboard">Dashboard</a>
            <a href="#Fleet">Fleet</a>
            <a href="#Telemetry">Telemetry</a>
            <a href="#Alerts">Alerts</a>
        </nav>

        <!-- System online, timing -->
        <div class="header-right">
            <span class="online-dot"></span>
            <span>SYSTEM ONLINE</span>
            <strong id="clock">--:--:--</strong>
        </div>

        <!-- Dispatch mission button -->
        <button id="dispatch-open" type="button">+Dispatch Mission</button>
    </header>
    <h1>This is the next part..... This is the example of the Git commit </h1>

    <script src="/script.js"></script>


</body>
</html>
